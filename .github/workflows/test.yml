name: Tests

# Garde-fou de non-régression : exécute la suite smoke (Playwright + Chromium
# headless) + les tests PWA. Bloquant si activé en "required check" dans
# Settings → Branches → Branch protection. Cf. .claude/plans/game-review-modularization.md §5.2.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# Annule un run précédent encore en cours sur la même réf (PR ou branche).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke + PWA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour le diff de bump cache (vs base PR)

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versionnement du cache PWA (cohérence + bump des assets modifiés)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            node tools/check_cache_versions.js --base "origin/${{ github.base_ref }}"
          else
            node tools/check_cache_versions.js
          fi

      - name: Installer les dépendances de test
        run: npm install

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Tests unitaires (helpers purs, Node seul)
        run: node tests/units.js

      - name: Suite smoke (159 scénarios, runner modulaire)
        run: node tests/smoke.js

      - name: Tests PWA (manifest + Service Worker + offline)
        run: node tests/pwa-smoke.js
